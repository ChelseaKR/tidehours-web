name: ci

# The merge-blocking gate: `make verify` and nothing else (format, lint,
# types, tests with the NOAA accuracy gate and a 90% branch floor, a full
# build of every station with its checks, dependency audit, secrets,
# hygiene). A green check here is the same claim as a green `make verify`.
#
# Private repository: the runner comes from the CI_RUNS_ON repository
# variable (the portfolio's self-hosted Mac runner, set only once the runner
# is registered); unset, it is GitHub-hosted, which costs minutes.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

# One group per commit on a push, one per branch on a pull request: a
# ref-only key evicts pending runs on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          # `make secrets` runs `gitleaks git` over every commit.
          fetch-depth: 0
          persist-credentials: false

      - name: install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: install node
        # tests/test_today.py runs the station page's inline script under Node.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: tools/site-checks/.nvmrc

      - name: install pinned gitleaks and osv-scanner
        # Release binaries checked against the hashes in their releases'
        # checksum files. The architecture follows the runner: the Mac runners
        # are linux/arm64, hosted runners x86_64.
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256_X64: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          GITLEAKS_SHA256_ARM64: e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080
          OSV_SCANNER_VERSION: 2.6.0
          OSV_SCANNER_SHA256_AMD64: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
          OSV_SCANNER_SHA256_ARM64: 2c71403eb443d05891c4f268c3ad771cf4f16e5443463fd7851ef8f454d3c7e4
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) gl_arch=x64; gl_sha="$GITLEAKS_SHA256_X64"; osv_arch=amd64; osv_sha="$OSV_SCANNER_SHA256_AMD64" ;;
            aarch64|arm64) gl_arch=arm64; gl_sha="$GITLEAKS_SHA256_ARM64"; osv_arch=arm64; osv_sha="$OSV_SCANNER_SHA256_ARM64" ;;
            *) echo "::error::no pinned binaries for $(uname -m)"; exit 1 ;;
          esac
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_${gl_arch}.tar.gz"
          echo "${gl_sha}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$bin" gitleaks
          curl -sSfL -o "$bin/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_${osv_arch}"
          echo "${osv_sha}  $bin/osv-scanner" | sha256sum --check --strict
          chmod +x "$bin/osv-scanner"
          echo "$bin" >> "$GITHUB_PATH"

      - name: make verify
        run: make verify
