name: publish

# The daily build and deploy: every station's today and tomorrow, at 11:20
# UTC, when every US station's local date is the same day
# (docs/DECISIONS.md 0002), then tidehours.com (DECISIONS 0009).
#
# Two jobs. `build` runs on a hosted runner, builds and checks the site, and
# uploads it as a one-day artifact. It holds no AWS credentials. It used the
# self-hosted Mac runner until 2026-11-02, but the Mac sleeps at 11:20 UTC
# (4:20 AM Pacific), so the scheduled build failed on 11-01 and 11-02 with
# "the self-hosted runner lost communication" (DECISIONS 0010). The build
# takes about a minute, well inside the free hosted minutes. `deploy` runs on a HOSTED
# runner, assumes the deploy role through GitHub OIDC (the role trusts only
# this repository's main branch), and runs scripts/deploy.sh: sync with
# --delete, Cache-Control per type, invalidate, then checks the live home
# page is the one it just built.
#
# PUBLISH_ENABLED gates both: a scheduled run is skipped unless it is
# "true", and a manual run with it unset builds and uploads for review but
# deploys nothing.
#
# Variables: PUBLISH_ENABLED, AWS_DEPLOY_ROLE_ARN, SITE_BUCKET,
# CLOUDFRONT_DISTRIBUTION_ID (infra/README.md), and optional
# GA4_MEASUREMENT_ID (empty: no analytics) and APP_STORE_URL (empty:
# "Coming soon to the App Store").

on:
  schedule:
    - cron: "20 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'schedule' || vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: main
          persist-credentials: false

      - name: install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: install dependencies
        run: uv sync --frozen

      - name: build every station for today
        env:
          GA4_MEASUREMENT_ID: ${{ vars.GA4_MEASUREMENT_ID }}
          APP_STORE_URL: ${{ vars.APP_STORE_URL }}
        run: |
          set -euo pipefail
          uv run --frozen tidehours --out site \
            --ga4-id "$GA4_MEASUREMENT_ID" --app-store-url "$APP_STORE_URL"
          uv run --frozen python scripts/check_site.py site

      - name: upload the site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: site
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    if: vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      SITE_BUCKET: ${{ vars.SITE_BUCKET }}
      DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      # No GitHub environment: it would change the OIDC subject the role
      # trusts (repo:ChelseaKR/tidehours-web:ref:refs/heads/main).
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/deploy.sh
          sparse-checkout-cone-mode: false

      - name: download the site
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: site
          path: site

      - name: configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: sync and invalidate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SITE_BUCKET"
          test -n "$DISTRIBUTION_ID"
          scripts/deploy.sh site "$SITE_BUCKET" "$DISTRIBUTION_ID"

      - name: check the live home page is this build
        shell: bash
        run: |
          set -euo pipefail
          want=$(sha256sum site/index.html | cut -d' ' -f1)
          got=$(curl -sSf --retry 3 --retry-all-errors https://tidehours.com/ | sha256sum | cut -d' ' -f1)
          if [ "$want" != "$got" ]; then
            echo "::error::https://tidehours.com/ is not the page this run built"
            exit 1
          fi
          station=$(curl -sS -o /dev/null -w '%{http_code}' https://tidehours.com/stations/9414290/)
          missing=$(curl -sS -o /dev/null -w '%{http_code}' https://tidehours.com/no-such-page/)
          if [ "$station" != "200" ] || [ "$missing" != "404" ]; then
            echo "::error::station page $station (want 200), missing page $missing (want 404)"
            exit 1
          fi
