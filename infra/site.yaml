AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  tidehours.com static site: private S3 origin behind CloudFront (Origin Access
  Control), ACM certificate, Route 53 aliases, and the GitHub OIDC deploy role
  for ChelseaKR/tidehours-web. Deploy in us-east-1 (the certificate must live
  there) in the tidehours member account. See infra/README.md.

Parameters:
  DomainName:
    Type: String
    Default: tidehours.com
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: The tidehours.com hosted zone created by domain registration.
  GitHubSubjects:
    Type: CommaDelimitedList
    # GitHub issues this repository's tokens with an immutable subject (owner
    # and repository ids; GET /repos/ChelseaKR/tidehours-web/actions/oidc/customization/sub
    # shows use_immutable_subject: true), so the legacy name-only form alone
    # never matched and the first deploy failed (DECISIONS 0012). Both forms
    # name main only.
    Default: "repo:ChelseaKR@3114598/tidehours-web@1441166194:ref:refs/heads/main,repo:ChelseaKR/tidehours-web:ref:refs/heads/main"
    Description: OIDC `sub` claims allowed to assume the deploy role (main only).

Resources:
  # ---- Origin -------------------------------------------------------------
  # Private, encrypted, owner-enforced. Versioned with a 7-day noncurrent
  # expiry: a bad `sync --delete` is recoverable for a week, and the daily
  # full re-upload (about 54 MB) does not pile up old versions.
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "tidehours-site-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-noncurrent-7d
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
            ExpiredObjectDeleteMarker: true
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudFrontReadsThroughOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
          # ListBucket lets a missing key come back as 404 instead of 403.
          - Sid: CloudFrontListsThroughOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:ListBucket
            Resource: !GetAtt SiteBucket.Arn
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt SiteBucket.Arn
              - !Sub "${SiteBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: tidehours-site-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ---- Certificate ---------------------------------------------------------
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames:
        - !Sub "www.${DomainName}"
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
        - DomainName: !Sub "www.${DomainName}"
          HostedZoneId: !Ref HostedZoneId

  # ---- Edge logic ----------------------------------------------------------
  # Viewer request: www -> apex (301); a path with no extension and no
  # trailing slash -> the same path with a slash (301, the canonical form);
  # a path ending in "/" -> its index.html in the bucket.
  # Checked after each stack change with `aws cloudfront test-function`
  # (infra/README.md).
  ViewerRequestFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: tidehours-viewer-request
      AutoPublish: true
      FunctionConfig:
        Comment: www to apex, trailing-slash redirect, index.html for directories
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        var APEX = 'tidehours.com';

        function redirect(location) {
          return {
            statusCode: 301,
            statusDescription: 'Moved Permanently',
            headers: {
              location: { value: location },
              'cache-control': { value: 'public, max-age=86400' }
            }
          };
        }

        function handler(event) {
          var request = event.request;
          var host = request.headers.host ? request.headers.host.value.toLowerCase() : '';
          var uri = request.uri;
          var qs = request.rawQueryString();
          var suffix = qs ? '?' + qs : '';
          var last = uri.slice(uri.lastIndexOf('/') + 1);
          var needsSlash = last !== '' && last.indexOf('.') === -1;

          if (host !== APEX) {
            return redirect('https://' + APEX + uri + (needsSlash ? '/' : '') + suffix);
          }
          if (needsSlash) {
            return redirect('https://' + APEX + uri + '/' + suffix);
          }
          if (uri.charAt(uri.length - 1) === '/') {
            request.uri = uri + 'index.html';
          }
          return request;
        }

  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: tidehours-security-headers
        Comment: HSTS, CSP (GA4 allowed), nosniff, frame deny, referrer, permissions
        SecurityHeadersConfig:
          StrictTransportSecurity:
            Override: true
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: false
            Preload: false
          ContentTypeOptions:
            Override: true
          FrameOptions:
            Override: true
            FrameOption: DENY
          ReferrerPolicy:
            Override: true
            ReferrerPolicy: strict-origin-when-cross-origin
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: >-
              default-src 'self'; base-uri 'self'; object-src 'none';
              frame-ancestors 'none'; form-action 'self';
              img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com;
              style-src 'self' 'unsafe-inline';
              script-src 'self' 'unsafe-inline' https://*.googletagmanager.com;
              connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://www.google.com
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: "geolocation=(), microphone=(), camera=(), interest-cohort=()"
              Override: true

  # ---- Distribution ----------------------------------------------------------
  # CachingOptimized (managed) honors the Cache-Control that scripts/deploy.sh
  # sets per file type; the deploy invalidates "/*" after each daily sync.
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: tidehours.com static site
        Enabled: true
        Aliases:
          - !Ref DomainName
          - !Sub "www.${DomainName}"
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: site-bucket
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: site-bucket
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref SecurityHeaders
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt ViewerRequestFunction.FunctionMetadata.FunctionARN
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60

  # ---- DNS -------------------------------------------------------------------
  ApexA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2 # CloudFront's fixed alias zone
  ApexAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
  WwwA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "www.${DomainName}"
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
  WwwAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "www.${DomainName}"
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  # ---- GitHub Actions deploy role -----------------------------------------
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: tidehours-web-deploy
      Description: publish.yml deploy job; sync the site bucket and invalidate the distribution.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Ref GitHubSubjects
      Policies:
        - PolicyName: site-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt SiteBucket.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub "${SiteBucket.Arn}/*"
              - Effect: Allow
                Action: [cloudfront:CreateInvalidation, cloudfront:GetInvalidation]
                Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

Outputs:
  BucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
  CertificateArn:
    Value: !Ref Certificate
